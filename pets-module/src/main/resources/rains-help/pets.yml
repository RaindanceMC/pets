id: pets
title: Pets
summary: Pets that fight beside you — how to get one, call it, ride it, name it, and how it grows.
intro: |
  A pet follows you, fights for you, and can be ridden. It grows with you, and its nature changes a little with how you treat it.
icon: BONE
category: Fun
order: 30
module: pets
aliases: [pet, pets, companion]
keywords: [pet, companion, ride, mount, wolf, level, personality, rarity, mythic, supporter]
commands: [pets]
sections:
  - question: How do I get a pet?
    title: Getting one
    text: |
      {run:/pets species} shows every species, from common to mythic. Common ones are free or bought; everything rarer is earned by playing — fishing, foraging, slaying monsters — given by a rank, or a thank-you for the server's supporters. The rarest are only ever found: once in a long while a blaze, a ravager or a wither lets its own kind fall for whoever slew it.
      Rarer pets stay a question mark until you have seen one out with somebody.
  - question: How do I call and send home my pet?
    title: Out and home
    text: |
      {run:/pets} lists your pets: click one to call it or send it home, right-click it for everything else. Or type {cmd:/pets call <pet>} and {cmd:/pets home <pet>}.
      You can have {setting:pets:pets.out-at-once|count} out at once{if:pets:pets.out-at-once-supporters > pets:pets.out-at-once}, supporters {setting:pets:pets.out-at-once-supporters|count}{/if}. Pets go when you log out or vanish, and come back with you.
  - question: Can I ride my pet?
    title: Riding
    when: pets:pets.riding
    text: |
      Right-click your own pet to climb on; walk with the usual keys, sprint to go faster. A flying pet flies with you — look where you want to go, jump to climb. Sneak to get off.
  - question: How does my pet fight?
    title: Fighting
    text: |
      Fighters bite, guards draw monsters onto themselves, ranged pets throw, healers mend you. {cmd:/pets mode <pet>} switches between aggressive (joins your fights, hunts monsters near you), defensive (only what hurts you) and passive.
      {cmd:/pets tactic <pet>} picks how it fights: balanced (circles and darts in), relentless (presses in, chases further), hit and run (bites and backs off) or cautious (stays near you, comes back early when hurt). Pets go first for whatever hurts you, then the weakest and nearest, and leave a foe your other pets will finish anyway.
      Out of a fight and near you, a hurt pet mends by itself — a seasoned one quicker — and keeps close to you until it has; a badly hurt one is slower and rests more.
      A beaten pet is never lost: it is knocked out for {setting:pets:pets.knocked-out-seconds|count} seconds and can be called again.
  - question: How does my pet grow?
    title: Levels and personality
    text: |
      Every monster it finishes off brings experience, up to level {setting:pets:pets.highest-level|count}; each level adds health and bite.
      Every pet is born with a personality — brave, timid, playful, lazy, fierce, gentle, cheeky, stoic, curious or balanced — that changes how hard it hits, how fast it runs, how long it lasts and how far it wanders. Fighting together makes it bolder and wilder, riding livelier, treats gentler (hold food and right-click it), finding new places with you more curious. It bends, but only so far.
      Whenever you stand about, or have told it to stay, your pet goes exploring nearby — a curious one far and often, an incurious one hardly at all.
  - question: Can I name my pet?
    title: Names
    text: |
      {cmd:/pets rename <pet> <name>}, or right-click it in {run:/pets}. Its name can be painted like your own — colours, gradients, bold and the rest — and everybody sees whose it is.
