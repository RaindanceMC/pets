# Rain's Pets — the skill tree every pet grows on, read by Core's SkillTree. A point a level.
# Seven role branches, each opening with its calling: a pet follows one calling at a time (they shut each
# other), its own species' is free, another costs its points; the role's nodes need its calling. Two branches
# for any pet: Bond and Steed. Every branch ends in a mastery badge, free once the rest of it is taken.
# Effects (per rank): percent unless said — health damage speed attack_speed regen heal xp ability_power
# ability_haste lifesteal toughness thorns; collect and spot in blocks; aura_<effect> in levels of that effect.
branches:
  fighter:
    title: Fighter
    icon: iron_sword
    blurb: "Bites hard and keeps biting."
  guard:
    title: Guard
    icon: shield
    blurb: "Takes the hits meant for you, and gives some back."
  ranged:
    title: Ranged
    icon: bow
    blurb: "Keeps its distance and never misses twice."
  healer:
    title: Healer
    icon: golden_apple
    blurb: "Keeps you standing, and itself."
  gatherer:
    title: Gatherer
    icon: hopper
    blurb: "Fetches what lies about to you: drops and experience."
  support:
    title: Support
    icon: note_block
    blurb: "Sings you faster, stronger, tougher."
  scout:
    title: Scout
    icon: spyglass
    blurb: "Fast, and sees monsters coming before you do."
  bond:
    title: Bond
    icon: red_dye
    blurb: "Whatever it is, it is yours: tougher, quicker to learn, quicker to mend."
  steed:
    title: Steed
    icon: saddle
    blurb: "Carries you faster — and a legendary's power hits harder, sooner."

