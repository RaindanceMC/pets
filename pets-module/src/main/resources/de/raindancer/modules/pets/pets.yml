# Rain's Pets — the species this server offers. Written once into plugins/RainsPets/pets.yml; edit that copy.
#
#   mob:      the vanilla mob (Bukkit's EntityType name)       role:   fighter | guard | ranged | healer
#   rarity:   common | uncommon | rare | epic | legendary | mythic — the pages of /pets
#   health:   half hearts at level one                        damage: a hit (a healer's mend) at level one
#   speed:    blocks per tick, following and ridden           size:   how tall, in player heights (0.15–0.6);
#                                                                     always smaller than the wild mob
#   flies:    flies when following and when ridden            baby:   the young version, where there is one
#   unlock:   free | earn <activity> [thing] <count> [+ <activity> [thing] <count> …] | buy <price> | permission | supporter
#             With "+", every part has to be done: "earn boss wither 3 + raid 1".
#             drop monster|boss <mob> 1/<n>: never earned, only found — one kill in about n of that mob lets it fall
#             (spawner mobs never); a legendary or mythic one that falls is told to the whole server.
#             Only common pets can be bought; anything rarer is earned, granted or a Prime pet (unlock: supporter — Prime members and the server's supporters).
#             activities: monster boss fish breed harvest mine dig excavate chop forage craft cook brew build
#             tame explore travel raid trade enchant …  ("earn boss ender_dragon 1": slay the dragon once)
#             Whatever the way, pets.species.<id> hands the species to a rank.
#   ability:  legendary and mythic only — what it does when its rider swings at the air: wither_skulls,
#             sonic_boom, fireball, flame_volley, gust, roar, curse, mending_rain, illusion
#   missile:  what a ranged pet throws — none of them breaks or burns anything
